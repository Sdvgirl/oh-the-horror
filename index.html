let A,mg,rainG,humG,musG,NB,bm,br,bs;

rainG=A.createGain();rainG.gain.value=0;rainG.connect(br);
const loop=(f,q,t,g)=>{const s=A.createBufferSource();s.buffer=NB;s.loop=true;const fl=A.createBiquadFilter();fl.type=t;fl.frequency.value=f;fl.Q.value=q;const gn=A.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(rainG);s.start();return gn};
loop(6500,.2,'highpass',.1);const g2=loop(2200,.35,'bandpass',.28);loop(900,.5,'lowpass',.18);loop(200,.7,'lowpass',.3);const lf=A.createOscillator(),lg=A.createGain();lf.frequency.value=.13;lg.gain.value=.07;lf.connect(lg);lg.connect(g2.gain);lf.start();setInterval(()=>{if(rainG.gain.value>.1&&R()<.6)nz(2500+R()*2500,.04,.05)},90);
humG=A.createGain();humG.gain.value=0;const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;[55,58.4,82.5].forEach(f=>{const o=A.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start()});lp.connect(humG);humG.connect(bs);
musG=A.createGain();musG.gain.value=0;musG.connect(bm);rain(.5,3);applyVol();
const mel=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46],bas=[130.81,174.61,196,146.83];let mi=0;
setInterval(()=>{if(musG.gain.value>.01){const k=mi++;if(R()<.85)blip(mel[k%8],1.4,.12,'triangle',musG);if(k%8==0)blip(bas[(k>>3)%4],3.2,.14,'sine',musG)}},520);
(function drip(){if(!S.sil)blip(900+R()*900,.06,.04+R()*.03);setTimeout(drip,1200+R()*3800)})();
(function storm(){if(S.sc==='apt'&&!S.lock){S.lt=1;setTimeout(()=>S.lt=0,90);setTimeout(()=>S.lt=1,200);setTimeout(()=>S.lt=0,330);setTimeout(thunder,500+R()*1500)}setTimeout(storm,9000+R()*9000)})();
setInterval(()=>{if(S.hb){thump(.35);setTimeout(()=>thump(.2),190)}},780)}
function blip(f,dur,v,type,dest){if(!A)return;const o=A.createOscillator(),g=A.createGain(),t=A.currentTime;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||bs);o.start(t);o.stop(t+dur+.05)}
function nz(f,dur,v){if(!A)return;const s=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain(),t=A.currentTime;s.buffer=NB;fl.type='lowpass';fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(bs);s.start(t,R());s.stop(t+dur)}
const thump=v=>{if(!A)return;const o=A.createOscillator(),g=A.createGain(),t=A.currentTime;o.frequency.setValueAtTime(75,t);o.frequency.exponentialRampToValueAtTime(35,t+.15);g.gain.setValueAtTime(v*1.4,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(bs);o.start(t);o.stop(t+.25)};
const knock=()=>{nz(260,.16,.9);thump(.9)},thunder=()=>{nz(90,4,.7);setTimeout(()=>nz(160,2.5,.4),500)},step=v=>nz(380,.07,v||.1),ding=()=>{blip(1320,1,.1);setTimeout(()=>blip(990,1.2,.08),160)};

const mus=v=>musG&&musG.gain.linearRampToValueAtTime(v,A.currentTime+2);
const rain=(v,s)=>rainG&&rainG.gain.linearRampToValueAtTime(v,A.currentTime+(s||2));

async function coke(){S.coke=0;S.lock=1;nz(5000,.5,.25);await say("Pshhht. Cold, sweet, perfect.",2600);await say("Tiny burp. Morale +1.",2200);S.lock=0}

await say("Crunch. ...Soft. Wrong. Very wrong.",3200);S.veg=0;await say("I don't feel so good.",2200);await go('bath',1);await say("Oh no.",1400);await say("Oh no no no.",1800);
S.shake=7;for(let i=0;i<3;i++){nz(650,.7,.6);thump(.5);await wait(900)}S.shake=0;S.sick=1;
await say("...Never again.",2400);await say("I feel like a new person. A hollow, regretful person.",3600);S.lock=0}
const MQ=["Hello, gorgeous. Okay, hello, tired.","I look exactly like someone who's been indoors for six days.","Hair: a situation. Vibes: immaculate.","Mirror, mirror... is there anything in my teeth?","Is that a new freckle? Cute.","We look good today. Just don't look behind us. (Joking!)","Pep talk: you are brave. You are going to the grocery store. Wow.","I should wave first. In case the reflection waves second."];
